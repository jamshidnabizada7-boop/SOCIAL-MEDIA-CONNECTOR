name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: local-e2e-only
          POSTGRES_DB: ariahub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aria -d ariahub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOG_LEVEL: error
      NEXT_TELEMETRY_DISABLED: "1"
      ARIA_E2E_DATABASE_URL: postgres://aria:local-e2e-only@127.0.0.1:5432/ariahub_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ops
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:api && npm run build:worker
      - run: npx playwright install --with-deps chromium
      # The browser harness builds the web app in API mode and runs isolated services.
      - run: npm run test:e2e
      - run: npm run test:e2e:demo
      - run: npm run test:load
      - run: npm run test:feed-load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            test-results/
            .local/load-test.json
            .local/feed-load-test.json
            .local/feed-evidence/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate containers, migrations, backup and restore
        run: sh deploy/smoke-test.sh
