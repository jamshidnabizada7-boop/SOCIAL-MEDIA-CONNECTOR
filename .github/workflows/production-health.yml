name: Production health
on:
  schedule:
    # Avoid the busiest start-of-hour queue and register the schedule on master.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send one clearly labelled monitoring test email
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public production availability and send state-change alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARIA_MONITOR_SMTP_URL: ${{ secrets.ARIA_MONITOR_SMTP_URL }}
          TEST_ALERT: ${{ inputs.test_alert && 'true' || 'false' }}
        run: |
          if [ "$TEST_ALERT" = true ]; then
            python3 scripts/production_monitor.py --test-alert
          else
            python3 scripts/production_monitor.py
          fi
