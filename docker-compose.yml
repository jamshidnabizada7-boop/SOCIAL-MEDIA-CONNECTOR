services:
  postgres:
    image: postgres:17-alpine
    container_name: ariahub-postgres
    environment:
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: aria_local_dev
      POSTGRES_DB: ariahub
    ports:
      - "5432:5432"
    volumes:
      - ariahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria -d ariahub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ariahub-redis
    ports:
      - "6379:6379"
    volumes:
      - ariahub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ariahub_pgdata:
  ariahub_redisdata:
